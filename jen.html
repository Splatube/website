<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Happy bday jennnn</title>
    <link rel="icon" type="image/png" href="fop.png">
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: #141415;
            overflow-x: hidden;
        }

        #title {
            position: relative;
            z-index: 2;
            margin: 0;
            padding: 28px 12px;
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(2.4rem, 7vw, 5rem);
            text-align: center;
            color: #f0f0f0;
            text-shadow: 0 2px 14px #000;
            pointer-events: none;
        }

        .confetti-stage {
            position: relative;
            width: 100%;
            min-height: 100vh;
            
            overflow: hidden;
            background: #141415;
            isolation: isolate;
        }

        .confetti-field {
            position: absolute;
            z-index: 1;
            inset: 0 3%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            height: 1000px;
            pointer-events: none;
        }

        .piece {
            position: relative;
            top: -18px;
            flex: 0 0 auto;
            border-radius: 2px;
            animation: confetti-fall 1.8s linear infinite;
        }

        .piece:nth-child(8n+1) { background: #ff6b6b; }
        .piece:nth-child(8n+2) { background: #38bdf8; }
        .piece:nth-child(8n+3) { background: #ffd444; }
        .piece:nth-child(8n+4) { background: #b8ff57; }
        .piece:nth-child(8n+5) { background: #f472b6; }
        .piece:nth-child(8n+6) { background: #57d9a3; }
        .piece:nth-child(8n+7) { background: #c084fc; }
        .piece:nth-child(8n)   { background: #ff9040; }

        .piece:nth-child(5n+1) { width: 8px; height: 12px; }
        .piece:nth-child(5n+2) { width: 12px; height: 8px; border-radius: 50%; }
        .piece:nth-child(5n+3) { width: 6px; height: 14px; }
        .piece:nth-child(5n+4) { width: 14px; height: 6px; }
        .piece:nth-child(5n)   { width: 9px; height: 9px; border-radius: 50%; }

        .piece:nth-child(7n+1) { animation-duration: 1.86s; }
        .piece:nth-child(7n+2) { animation-duration: 1.5s; }
        .piece:nth-child(7n+3) { animation-duration: 2.1s; }
        .piece:nth-child(7n+4) { animation-duration: 1.62s; }
        .piece:nth-child(7n+5) { animation-duration: 2.22s; }
        .piece:nth-child(7n+6) { animation-duration: 1.74s; }
        .piece:nth-child(7n)   { animation-duration: 1.98s; }

        .piece:nth-child(11n+1)  { animation-delay: -0.9s; }
        .piece:nth-child(11n+2)  { animation-delay: -1.7s; }
        .piece:nth-child(11n+3)  { animation-delay: -0.3s; }
        .piece:nth-child(11n+4)  { animation-delay: -2.05s; }
        .piece:nth-child(11n+5)  { animation-delay: -1.2s; }
        .piece:nth-child(11n+6)  { animation-delay: -0.55s; }
        .piece:nth-child(11n+7)  { animation-delay: -1.95s; }
        .piece:nth-child(11n+8)  { animation-delay: -0.75s; }
        .piece:nth-child(11n+9)  { animation-delay: -1.45s; }
        .piece:nth-child(11n+10) { animation-delay: -0.15s; }
        .piece:nth-child(11n)    { animation-delay: -2.3s; }

        .piece:nth-child(3n+2) { margin-left: 1.4%; }
        .piece:nth-child(3n)   { margin-right: 1.8%; }

        @keyframes confetti-fall {
            0%   { transform: translateY(0) rotate(0deg) scaleX(1); opacity: 1; }
            25%  { transform: translateY(16px) rotate(90deg) scaleX(0); }
            50%  { transform: translateY(65px) rotate(180deg) scaleX(-1); }
            75%  { transform: translateY(146px) rotate(270deg) scaleX(0); opacity: 1; }
            100% { transform: translateY(260px) rotate(360deg) scaleX(1); opacity: 0; }
        }

        .img-container {
            position: absolute;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .img {
            position: absolute;
            margin: 0;
            padding: 0;
            line-height: 0;
        }

        .img img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 5px 10px rgb(0 0 0 / 35%));
        }

        @media (prefers-reduced-motion: reduce) {
            .piece { animation: none; }
        }
    </style>
</head>

<script>
    console.log()

    const stage = document.getElementById("stage");
    const container = document.getElementById("img-container");

    function placeImages() {
        container.replaceChildren();
        const stageWidth = stage.clientWidth;
        const stageHeight = stage.clientHeight;
        let images = [];

        async function getWebsiteFolderFiles() {
            try {
                const response = await fetch('/jen/list.txt');
                if (!response.ok) throw new Error('Dynamic folder map not found.');

                images = await response.json();

                console.log(images, images.length);

            } catch (error) {
                console.error('Failed to retrieve file list dynamically:', error);
            }
        }

        function shuffleArray(array) {
            for (var i = array.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var temp = array[i];
                array[i] = array[j];
                array[j] = temp;
            }
        }

        // Fire automatically when the browser window loads
        window.addEventListener('DOMContentLoaded', getWebsiteFolderFiles);

        // Shuffle the list so images don't always appear in the same order.
        shuffleArray(images)
        console.log(images)

        images.forEach((src, index) => {
            const frame = document.createElement("div");
            frame.className = "img";
            frame.id = "photo-" + (index + 1);

            console.log(src);
            const image = document.createElement("img");
            image.src = "jen/" + src;
            image.alt = "";
            image.loading = "lazy";
            image.decoding = "async";

            // Choose a different target size for each image, then cap both
            // dimensions so very wide/tall images fit without distortion.
            const targetWidth = 150 + Math.random() * 170;
            const targetHeight = Math.min(270, stageHeight * 0.38);

            image.addEventListener("load", () => {
                const ratio = image.naturalWidth / image.naturalHeight || 1;
                let width = targetWidth;
                let height = width / ratio;

                if (height > targetHeight) {
                    height = targetHeight;
                    width = height * ratio;
                }
                width = Math.min(width, Math.max(55, stageWidth * 0.42));
                height = width / ratio;
                if (height > targetHeight) {
                    height = targetHeight;
                    width = height * ratio;
                }

                frame.style.width = width*1.5 + "px";
                frame.style.height = height*1.5 + "px";
                frame.style.left = Math.max(0, Math.random() * (stageWidth - width)) + "px";
                frame.style.top = (90 + Math.random() * Math.max(0, stageHeight - height - 90)) + "px";
            });

            image.addEventListener("error", () => frame.remove());
            frame.appendChild(image);
            container.appendChild(frame);
        });
    }

    placeImages();
    window.addEventListener("resize", placeImages);
</script>
